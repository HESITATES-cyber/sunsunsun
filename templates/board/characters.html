{% load static %}
<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>キャラクター一覧｜食事タイプ診断</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
<link rel="stylesheet" href="{% static 'css/characters.css' %}">
</head>

<body>

<header class="header">
  <a href="{% url 'board:index' %}">
    <img src="{% static 'img/logo.png' %}" alt="食事タイプ診断">
  </a>
  
  <div class="header-center">

    <nav class="nav-item d-inline me-3">
      <a href="{% url 'board:board' %}" class="nav-link">掲示板</a>
    </nav>
  
    <nav class="nav-item d-inline me-3">
      <a href="{% url 'board:characters' %}" class="nav-link">キャラクター一覧</a>
    </nav>
  
    {% if user.is_authenticated %}
      <!-- ログイン中 -->
      <nav class="nav-item d-inline">
        <form method="post" action="{% url 'logout' %}" style="display:inline;">
          {% csrf_token %}
          <button type="submit" class="nav-link btn-link">ログアウト</button>
        </form>
      </nav>
    {% else %}
      <!-- 未ログイン -->
      <nav class="nav-item d-inline">
        <a href="{% url 'login' %}" class="nav-link">ログイン</a>
      </nav>
    {% endif %}
  
  </div>
</header>

<main class="container-fluid my-5">
  <h1 class="text-center mb-5">キャラクター一覧</h1>

  <div id="character-list"></div>

  <div class="text-center mt-5">
    <a href="{% url 'board:index' %}" class="btn btn-primary">トップに戻る</a>
  </div>
</main>

<script src="{% static 'js/characters.js' %}"></script>
</body>
</html>
