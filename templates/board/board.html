{% load static %}
<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <title>タイプ別掲示板</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <link rel="stylesheet" href="{% static 'css/board.css' %}">

  <!-- CSRFトークン -->
  <meta name="csrf-token" content="{{ csrf_token }}">
</head>

<body>
  {% include "components/header.html" %}

  <div class="board-container">
    <!-- サイドパネル -->
    <aside class="side-panel">
      <h3>タイプ一覧</h3>
      <div id="type-list"></div>
    </aside>

    <!-- 掲示板 -->
    <main class="board-main">
      {% if user.is_authenticated and user.profile.food_type != "undecided" %}
      <section class="my-type empty">
        <span class="label">あなたのタイプ</span>
        <div class="my-type-card">
          <img id="my-type-img" alt="自分のタイプ" style="display:none;">
          <strong id="my-type-name">未診断</strong>
          <span class="badge">あなた</span>
        </div>
      </section>
      {% endif %}

      <!-- 掲示板タイトル -->
      <section class="board-header">
        <div class="board-title-row">
          <h2 id="board-title"></h2>
          <span id="my-type-indicator" class="my-type-indicator">
            あなたのタイプ：<strong id="my-type-code">--</strong>
          </span>
        </div>
        <p>同じタイプの掲示板に投稿できます</p>
      </section>

      <!-- 読み取り専用表示 -->
      <div id="readonly" class="readonly hidden">
        他タイプは閲覧のみ可能です
      </div>

      <!-- 投稿一覧 -->
      <section id="post-list"></section>
    </main>
  </div>

  <!-- 投稿ボタン -->
  <button id="fab">＋</button>

  <!-- 投稿モーダル -->
  <div id="modal" class="modal hidden">
    <div class="modal-box">
      <h2>投稿する</h2>
      <textarea id="post-text" placeholder="内容を入力"></textarea>
      <div class="modal-actions">
        <button id="cancel-btn" class="modal-cancel" type="button">キャンセル</button>
        <button id="submit-btn" class="modal-submit" type="button">投稿</button>
      </div>
    </div>
  </div>

  <!-- 編集モーダル（投稿モーダルと同デザイン） -->
  <div id="edit-modal" class="modal hidden">
    <div class="modal-box">
      <h2>投稿を編集</h2>
      <textarea id="edit-text" placeholder="内容を編集"></textarea>
      <div class="modal-actions">
        <button id="edit-cancel" class="modal-cancel" type="button">キャンセル</button>
        <button id="edit-ok" class="modal-submit" type="button">保存</button>
      </div>
    </div>
  </div>

  <!-- 削除確認モーダル（投稿モーダルと同デザイン） -->
  <div id="confirm-modal" class="modal hidden">
    <div class="modal-box">
      <h2>削除しますか？</h2>
      <p class="modal-desc">この操作は取り消せません</p>
      <div class="modal-actions">
        <button id="confirm-no" class="modal-cancel" type="button">キャンセル</button>
        <button id="confirm-yes" class="modal-danger" type="button">削除</button>
      </div>
    </div>
  </div>

  <!-- JS -->
  <script src="{% static 'js/board.js' %}"></script>
</body>

</html>
