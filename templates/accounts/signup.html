<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>新規登録</title>
  {% load static %}
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
  <style>
    body {
      min-height: 100vh;
      margin: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #f4f6f8;
      font-family: sans-serif;
    }

    .card {
      width: 100%;
      max-width: 420px;
      background: #fff;
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
    }

    .card h1 {
      margin: 0 0 8px;
      text-align: center;
      font-size: 28px;
    }

    .card p {
      margin: 0 0 24px;
      text-align: center;
      color: #666;
      font-size: 14px;
    }

    form p {
      margin-bottom: 16px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-size: 13px;
      color: #444;
    }

    input {
      width: 100%;
      padding: 10px;
      font-size: 14px;
      border-radius: 6px;
      border: 1px solid #ccc;
      box-sizing: border-box;
    }

    .helptext {
      display: block;
      margin-top: 6px;
      color: #777;
      font-size: 12px;
      line-height: 1.4;
    }

    .errorlist {
      color: #d32f2f;
      font-size: 13px;
      margin: 0 0 8px;
      padding-left: 0;
      list-style: none;
    }

    .btn-main {
      display: block;
      width: 100%;
      padding: 12px;
      border: none;
      border-radius: 6px;
      background: #4f46e5;
      color: #fff;
      font-size: 15px;
      cursor: pointer;
      text-align: center;
      text-decoration: none;
      box-sizing: border-box;
    }

    .btn-main:hover {
      opacity: 0.9;
    }

    .btn-outline {
      background: transparent;
      color: #4f46e5;
      border: 1px solid #4f46e5;
    }

    .or {
      margin: 12px 0;
      text-align: center;
      color: #777;
      font-size: 14px;
    }
  </style>
</head>
<body>

  <div class="card">
    <h1>新規登録</h1>
    <p>ユーザー名・表示名・パスワードを入力してください</p>

    <form method="post">
      {% csrf_token %}
      {{ form.as_p }}

      <button type="submit" class="btn-main">登録</button>

      <div class="or">または</div>

      <a href="{% url 'login' %}" class="btn-main btn-outline">ログインへ戻る</a>
    </form>
  </div>

</body>
</html>
